<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StuyShuttle</title>
<meta name="description" content="NYU shuttles from Stuytown to campus — when to leave, when you arrive, live.">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StuyShuttle">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c0 .9.4 1.7 1 2.2V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.8c.6-.5 1-1.3 1-2.2V6c0-3.5-3.6-4-8-4S4 2.5 4 6v10zm3.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM6 11V6h12v5H6z"/></svg>
      </span>
      <span class="brand__name">StuyShuttle</span>
      <span class="brand__sub">Stuytown → NYU</span>
    </div>
    <button id="status" class="status status--starting" aria-live="polite" title="Tap to refresh">
      <span class="status__dot"></span><span>Connecting…</span>
    </button>
  </div>
</header>
<main id="app"><div class="booting">Loading timetable…</div></main>
<nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
<script type="module" src="./js/app.js"></script>
</body>
</html>
